<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 두쫀쿠맵</title>
    <link rel="icon" type="image/png" href="midium.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 로그인 화면 -->
    <div id="loginView" class="login-container">
        <div class="login-box">
            <a href="index.html" style="display: block; text-align: center;">
                <img src="logo.png" alt="두쫀쿠" class="login-logo">
            </a>
            <h2>두쫀쿠 판매카페 등록</h2>
            
            <button class="btn-google" onclick="signInWithGoogle()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/250px-Google_%22G%22_logo.svg.png" alt="Google" style="width: 20px; height: 20px; margin-right: 8px;">
                <span>Google로 로그인</span>
            </button>
            
            <div class="divider">또는</div>
            
            <div id="alertBox"></div>
            
            <input type="email" id="email" placeholder="이메일" required>
            <input type="password" id="password" placeholder="비밀번호" required>
            
            <button class="btn-primary" onclick="signInWithEmail()">로그인</button>
            
            <div style="text-align: center; margin-top: 15px;">
                <a href="#" onclick="signUpWithEmail(); return false;" style="color: #666; text-decoration: none; font-size: 14px;">이메일로 사장님 계정 만들기</a>
            </div>
        </div>
    </div>

    <!-- 대시보드 화면 -->
    <div id="dashboardView" class="dashboard-container" style="display: none;">
        <div class="dashboard-header">
            <div class="dashboard-logo-container">
                <a href="index.html">
                    <img src="logo.png" alt="두쫀쿠" class="dashboard-logo">
                </a>
            </div>
            <h1>매장 관리</h1>
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>

        <div class="dashboard-content">
            <div id="dashboardAlert"></div>
            
            <!-- 매장 연결 카드 (매장 정보가 없는 사용자에게만 표시) -->
            <div id="storeConnectCard" class="card store-connect-card" style="display: none;">
                <img src="duzonkus.png" alt="두쫀쿠" style="width: 100%; max-width: 120px; margin: 0 auto 20px; display: block;">
                <h3 style="text-align: center; margin-bottom: 10px; font-size: 22px;">이미 안내받은 매장이 있으신가요?</h3>
                <p style="text-align: center; color: #999; font-size: 14px; margin-bottom: 20px;">
                    관리자 또는 사장님으로부터 받은 매장 코드를 입력해 편집권한을 갖습니다
                </p>
                <div class="form-group">
                    <input type="text" id="storeCodeTop" placeholder="관리자 또는 사장님이 발급한 매장 코드를 입력하세요">
                </div>
                <button class="btn-save" onclick="connectStoreFromTop()">매장 연결</button>
            </div>
            
            <!-- 실시간 재고 관리 -->
            <div class="card inventory-card">
                <h3>실시간 재고 관리</h3>
                <div id="inventoryUpdateTime" class="inventory-update-time"></div>
                <input type="hidden" id="inventoryNumber" value="0">
                <div class="inventory-level-btns">
                    <button type="button" class="inventory-level-btn inventory-level-none" data-value="0" onclick="setInventoryLevel(0)">없음</button>
                    <button type="button" class="inventory-level-btn inventory-level-imminent" data-value="10" onclick="setInventoryLevel(10)">임박</button>
                    <button type="button" class="inventory-level-btn inventory-level-normal" data-value="40" onclick="setInventoryLevel(40)">보통</button>
                    <button type="button" class="inventory-level-btn inventory-level-plenty" data-value="70" onclick="setInventoryLevel(70)">여유</button>
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <label>홍보 문구</label>
                    <textarea id="plaintextInventory" placeholder="매장에 대한 간단한 소개를 작성해주세요." oninput="syncPlaintextFromInventory()" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 80px;"></textarea>
                </div>
                <button class="btn-save" onclick="savePlaintextOnly()">홍보문구 업데이트</button>
            </div>

            <!-- 매장 정보 관리 -->
            <div class="card">
                <h3>매장 정보</h3>

                <div class="form-group" id="storeCodeDisplayGroup" style="display: none;">
                    <label>매장 코드</label>
                    <div style="display: flex; gap: 8px; align-items: stretch;">
                        <input type="text" id="storeCodeDisplay" readonly style="flex: 1; background-color: #f5f5f5; cursor: not-allowed;">
                        <button type="button" id="storeCodeCopyBtn" onclick="copyStoreCode()" style="flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; font-weight: 500;">📋 복사</button>
                    </div>
                    <small style="color: #666;">다른 사용자가 매장에 연결할 때 이 코드를 알려주세요.</small>
                </div>
                
                <div class="form-group">
                    <label>대표 사진</label>
                    <div class="file-upload" onclick="document.getElementById('mainImage').click()">
                        <input type="file" id="mainImage" accept="image/*" onchange="previewImage(this, 'mainImagePreview')">
                        <p>📷 클릭하여 사진 업로드</p>
                        <div id="mainImagePreview" class="file-preview"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label>매장 좌표 (위도, 경도)</label>
                    <input type="text" id="location" placeholder="예: 37.5665, 126.9780">
                    <small style="color: #666;">Google 지도에서 위치를 우클릭하여 좌표를 복사할 수 있습니다.</small>
                </div>

                <div class="form-group">
                    <label>매장 주소</label>
                    <input type="text" id="address" placeholder="서울시 강남구 ...">
                </div>

                <div class="form-group">
                    <label>매장 이름</label>
                    <input type="text" id="subject" placeholder="매장 이름">
                </div>

                <div class="form-group">
                    <label>가격 (원)</label>
                    <input type="number" id="price" min="0" step="1" placeholder="예: 12000">
                </div>

                <div class="form-group">
                    <label>홍보 문구</label>
                    <textarea id="plaintext" placeholder="매장에 대한 간단한 소개를 작성해주세요." oninput="syncPlaintext()"></textarea>
                </div>

                <div class="form-group">
                    <label>연결 URL (선택)</label>
                    <input type="url" id="url" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label>사업자등록증 사진</label>
                    <div class="file-upload" onclick="document.getElementById('govImage').click()">
                        <input type="file" id="govImage" accept="image/*" onchange="previewImage(this, 'govImagePreview')">
                        <p>📄 클릭하여 사업자등록증 업로드</p>
                        <div id="govImagePreview" class="file-preview"></div>
                    </div>
                </div>

                <button class="btn-save" onclick="saveStoreInfo()">매장정보 저장</button>
            </div>

            <!-- 로그인 정보 관리 -->
            <div class="card">
                <h3>로그인 정보</h3>
                
                <div class="form-group">
                    <label>이메일 주소</label>
                    <input type="email" id="userEmail" readonly style="background-color: #f5f5f5; cursor: not-allowed;">
                    <small style="color: #666;">이메일 주소는 변경할 수 없습니다.</small>
                </div>

                <div id="connectedStoreInfo" class="form-group" style="display: none;">
                    <label>연결된 매장</label>
                    <input type="text" id="connectedStoreName" readonly style="background-color: #f5f5f5; cursor: not-allowed;">
                    <small style="color: #28a745;">✓ 매장이 연결되었습니다. 매장 정보를 관리할 수 있습니다.</small>
                </div>

                <div class="form-group">
                    <label>새 비밀번호</label>
                    <input type="password" id="newPassword" placeholder="새 비밀번호 (최소 6자)">
                </div>

                <div class="form-group">
                    <label>새 비밀번호 확인</label>
                    <input type="password" id="newPasswordConfirm" placeholder="새 비밀번호 다시 입력">
                </div>

                <button class="btn-save" onclick="changePassword()">비밀번호 변경</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        // config.js 로드 확인 및 Supabase 클라이언트 초기화
        let supabaseClient = null;
        
        function initSupabase() {
            if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
                console.error('config.js가 로드되지 않았습니다. SUPABASE_URL과 SUPABASE_ANON_KEY를 확인해주세요.');
                showAlert('loginView', '설정 파일을 불러올 수 없습니다. 페이지를 새로고침해주세요.', 'error');
                return false;
            }
            
            try {
                const { createClient } = supabase;
                supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                return true;
            } catch (error) {
                console.error('Supabase 클라이언트 초기화 실패:', error);
                showAlert('loginView', '데이터베이스 연결에 실패했습니다.', 'error');
                return false;
            }
        }

        let currentUser = null;
        let currentStoreId = null;

        // 페이지 로드 시 초기화 및 세션 확인
        window.addEventListener('load', async () => {
            if (!initSupabase()) return;
            
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    currentUser = session.user;
                    await showDashboard();
                }
            } catch (error) {
                console.error('세션 확인 오류:', error);
            }
        });

        // Google 로그인
        async function signInWithGoogle() {
            if (!supabaseClient) {
                if (!initSupabase()) return;
            }
            
            try {
                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.href
                    }
                });
                if (error) throw error;
            } catch (error) {
                console.error('Google 로그인 오류:', error);
                showAlert('loginView', error.message || 'Google 로그인에 실패했습니다.', 'error');
            }
        }

        // 이메일 로그인
        async function signInWithEmail() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('loginView', '이메일과 비밀번호를 입력해주세요.', 'error');
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                currentUser = data.user;
                await showDashboard();
            } catch (error) {
                showAlert('loginView', error.message, 'error');
            }
        }

        // 이메일 회원가입
        async function signUpWithEmail() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showAlert('loginView', '이메일과 비밀번호를 입력해주세요.', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('loginView', '비밀번호는 최소 6자 이상이어야 합니다.', 'error');
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) throw error;

                if (data.user) {
                    showAlert('loginView', '회원가입이 완료되었습니다. 로그인해주세요.', 'success');
                }
            } catch (error) {
                showAlert('loginView', error.message, 'error');
            }
        }

        // 로그아웃
        async function logout() {
            await supabaseClient.auth.signOut();
            currentUser = null;
            currentStoreId = null;
            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('loginView').style.display = 'flex';
        }

        // 대시보드 표시
        async function showDashboard() {
            document.getElementById('loginView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            
            // 이메일 주소 표시
            if (currentUser && currentUser.email) {
                document.getElementById('userEmail').value = currentUser.email;
            }
            
            // 기존 매장 정보 불러오기
            await loadStoreData();
        }

        // 매장 데이터 불러오기
        async function loadStoreData() {
            try {
                // user_id부터 user_id_6까지 현재 사용자인 매장 찾기
                const { data, error } = await supabaseClient
                    .from('doozonku')
                    .select('*')
                    .or(`user_id.eq.${currentUser.id},user_id_2.eq.${currentUser.id},user_id_3.eq.${currentUser.id},user_id_4.eq.${currentUser.id},user_id_5.eq.${currentUser.id},user_id_6.eq.${currentUser.id}`)
                    .maybeSingle();

                if (error) {
                    console.error('매장 데이터 로드 오류:', error);
                    if (error.code === 'PGRST116') {
                        console.log('기존 매장 정보 없음 (신규 등록)');
                    } else {
                        showAlert('dashboardView', `데이터 로드 오류: ${error.message}`, 'error');
                    }
                    return;
                }

                if (data) {
                    currentStoreId = data.id;
                    const num = data.number != null ? data.number : 0;
                    document.getElementById('inventoryNumber').value = num;
                    updateInventoryLevelUI(num);
                    document.getElementById('location').value = data.location || '';
                    document.getElementById('address').value = data.address || '';
                    document.getElementById('subject').value = data.subject || '';
                    document.getElementById('price').value = (data.price || data.price === 0) ? data.price : '';
                    document.getElementById('plaintext').value = data.plaintext || '';
                    document.getElementById('plaintextInventory').value = data.plaintext || '';
                    document.getElementById('url').value = data.url || '';

                    // 매장 코드 표시
                    if (data.store_code) {
                        document.getElementById('storeCodeDisplayGroup').style.display = 'block';
                        document.getElementById('storeCodeDisplay').value = data.store_code;
                    } else {
                        document.getElementById('storeCodeDisplayGroup').style.display = 'none';
                        document.getElementById('storeCodeDisplay').value = '';
                    }
                    
                    // 업데이트 시간 표시
                    if (data.updated_at) {
                        updateInventoryTime(data.updated_at);
                    }
                    
                    // 연결된 매장 정보 표시
                    document.getElementById('storeConnectCard').style.display = 'none';
                    document.getElementById('connectedStoreInfo').style.display = 'block';
                    document.getElementById('connectedStoreName').value = data.subject || '연결된 매장';
                    
                    if (data.img) {
                        document.getElementById('mainImagePreview').innerHTML = `<img src="${data.img}">`;
                    }
                    if (data.gov) {
                        document.getElementById('govImagePreview').innerHTML = `<img src="${data.gov}">`;
                    }
                } else {
                    // 매장이 없으면 상단 매장 연결 카드 표시, 매장 코드 영역 숨김
                    document.getElementById('storeConnectCard').style.display = 'block';
                    document.getElementById('connectedStoreInfo').style.display = 'none';
                    document.getElementById('storeCodeDisplayGroup').style.display = 'none';
                    document.getElementById('storeCodeDisplay').value = '';
                    document.getElementById('inventoryNumber').value = 0;
                    updateInventoryLevelUI(0);
                }
            } catch (error) {
                console.error('예상치 못한 오류:', error);
            }
        }

        // 재고 레벨 UI 갱신 (로드 시 어떤 버튼이 선택됐는지 표시, -1=두쫀쿠는 선택 없음)
        function updateInventoryLevelUI(value) {
            const num = parseInt(value, 10);
            if (num === -1 || isNaN(num)) {
                document.querySelectorAll('.inventory-level-btn').forEach(btn => btn.classList.remove('selected'));
                return;
            }
            const normalized = num <= 5 ? 0 : num <= 25 ? 10 : num <= 55 ? 40 : 70;
            document.querySelectorAll('.inventory-level-btn').forEach(btn => {
                btn.classList.toggle('selected', parseInt(btn.getAttribute('data-value'), 10) === normalized);
            });
        }

        // 재고 레벨 선택: 없음=0, 임박=10, 보통=40, 여유=70 → 즉시 저장
        async function setInventoryLevel(value) {
            const input = document.getElementById('inventoryNumber');
            input.value = value;
            updateInventoryLevelUI(value);
            await saveInventoryNumber();
        }

        // 재고 숫자만 즉시 저장 (버튼 클릭 시 호출)
        async function saveInventoryNumber() {
            const number = parseInt(document.getElementById('inventoryNumber').value || 0, 10);
            if (!currentStoreId) {
                showAlert('dashboardView', '먼저 매장 정보를 등록하거나 매장 코드로 연결해주세요.', 'error');
                return;
            }
            try {
                const { data, error } = await supabaseClient
                    .from('doozonku')
                    .update({ number: number })
                    .eq('id', currentStoreId)
                    .select('updated_at')
                    .single();
                if (error) throw error;
                if (data && data.updated_at) updateInventoryTime(data.updated_at);
                showAlert('dashboardView', '재고가 업데이트되었습니다.', 'success');
            } catch (error) {
                showAlert('dashboardView', '재고 업데이트 실패: ' + error.message, 'error');
            }
        }

        // 홍보문구만 저장
        async function savePlaintextOnly() {
            const plaintext = document.getElementById('plaintextInventory').value.trim();
            if (!currentStoreId) {
                showAlert('dashboardView', '먼저 매장 정보를 등록하거나 매장 코드로 연결해주세요.', 'error');
                return;
            }
            try {
                const { data, error } = await supabaseClient
                    .from('doozonku')
                    .update({ plaintext: plaintext })
                    .eq('id', currentStoreId)
                    .select('updated_at')
                    .single();
                if (error) throw error;
                document.getElementById('plaintext').value = plaintext;
                if (data && data.updated_at) updateInventoryTime(data.updated_at);
                showAlert('dashboardView', '홍보문구가 업데이트되었습니다.', 'success');
            } catch (error) {
                showAlert('dashboardView', '홍보문구 업데이트 실패: ' + error.message, 'error');
            }
        }

        // 시간 포맷팅 함수 (몇 분/시간/일 전)
        function formatTimeAgo(dateString) {
            if (!dateString) return '';
            
            const now = new Date();
            const date = new Date(dateString);
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) {
                return '방금 전 업데이트';
            } else if (diffMins < 60) {
                return `${diffMins}분 전 업데이트`;
            } else if (diffHours < 24) {
                return `${diffHours}시간 전 업데이트`;
            } else {
                return `${diffDays}일 전 업데이트`;
            }
        }

        // 업데이트 시간 표시
        function updateInventoryTime(updatedAt) {
            const timeElement = document.getElementById('inventoryUpdateTime');
            if (timeElement && updatedAt) {
                timeElement.textContent = formatTimeAgo(updatedAt);
            } else if (timeElement) {
                timeElement.textContent = '';
            }
        }

        // 홍보 문구 동기화 (매장 정보의 홍보 문구와 실시간 재고 관리의 홍보 문구 동기화)
        function syncPlaintext() {
            const plaintextValue = document.getElementById('plaintext').value;
            document.getElementById('plaintextInventory').value = plaintextValue;
        }

        // 실시간 재고 관리의 홍보 문구 변경 시 매장 정보의 홍보 문구도 동기화
        function syncPlaintextFromInventory() {
            const plaintextValue = document.getElementById('plaintextInventory').value;
            document.getElementById('plaintext').value = plaintextValue;
        }

        // 이미지 미리보기
        function previewImage(input, previewId) {
            const preview = document.getElementById(previewId);
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 이미지 업로드
        async function uploadImage(file, path) {
            const fileExt = file.name.split('.').pop();
            const fileName = `${Math.random().toString(36).substring(2)}_${Date.now()}.${fileExt}`;
            const filePath = `${path}/${fileName}`;

            const { data, error } = await supabaseClient.storage
                .from('doozonku-uploads')
                .upload(filePath, file, {
                    cacheControl: '3600',
                    upsert: false
                });

            if (error) {
                console.error('이미지 업로드 오류:', error);
                throw new Error(`이미지 업로드 실패: ${error.message}`);
            }

            const { data: { publicUrl } } = supabaseClient.storage
                .from('doozonku-uploads')
                .getPublicUrl(filePath);

            return publicUrl;
        }

        // 매장 코드 클립보드 복사
        function copyStoreCode() {
            const input = document.getElementById('storeCodeDisplay');
            const btn = document.getElementById('storeCodeCopyBtn');
            const code = input && input.value ? input.value.trim() : '';
            if (!code) return;
            navigator.clipboard.writeText(code).then(() => {
                if (btn) {
                    btn.textContent = '✓ 복사됨';
                    setTimeout(() => { btn.textContent = '📋 복사'; }, 1500);
                }
            }).catch(() => {
                showAlert('dashboardView', '복사에 실패했습니다.', 'error');
            });
        }

        // 매장 코드 자동 생성 (영문+숫자 6자 이내)
        function generateStoreCode() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        // 매장 정보 저장
        async function saveStoreInfo() {
            const location = document.getElementById('location').value.trim();
            const address = document.getElementById('address').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const priceValue = document.getElementById('price').value.trim();
            const plaintext = document.getElementById('plaintext').value.trim();
            const url = document.getElementById('url').value.trim();
            const number = parseInt(document.getElementById('inventoryNumber').value || 0);

            if (!location || !address || !subject) {
                showAlert('dashboardView', '필수 항목을 모두 입력해주세요.', 'error');
                return;
            }

            try {
                showAlert('dashboardView', '매장 정보를 저장하는 중...', 'info');

                let imgUrl = null;
                let govUrl = null;

                // 이미지 업로드
                const mainImageFile = document.getElementById('mainImage').files[0];
                if (mainImageFile) {
                    imgUrl = await uploadImage(mainImageFile, 'stores');
                }

                const govImageFile = document.getElementById('govImage').files[0];
                if (govImageFile) {
                    govUrl = await uploadImage(govImageFile, 'documents');
                }

                const storeData = {
                    user_id: currentUser.id,
                    location: location,
                    address: address,
                    subject: subject,
                    plaintext: plaintext,
                    url: url || null,
                    number: number,
                    checked: 'false'
                };

                if (priceValue !== '') {
                    const numericPrice = Number(priceValue);
                    storeData.price = isNaN(numericPrice) ? null : numericPrice;
                } else {
                    storeData.price = null;
                }

                if (imgUrl) storeData.img = imgUrl;
                if (govUrl) storeData.gov = govUrl;

                // 신규 매장 등록 시 매장 코드 자동 생성 (영문+숫자 6자)
                if (!currentStoreId) {
                    storeData.store_code = generateStoreCode();
                }

                let result;
                if (currentStoreId) {
                    // 업데이트
                    result = await supabaseClient
                        .from('doozonku')
                        .update(storeData)
                        .eq('id', currentStoreId);
                } else {
                    // 신규 등록
                    result = await supabaseClient
                        .from('doozonku')
                        .insert([storeData])
                        .select();
                    
                    if (result.data && result.data[0]) {
                        currentStoreId = result.data[0].id;
                    }
                }

                if (result.error) throw result.error;

                // 신규 등록 시 매장 코드 영역 표시 (저장 직후 바로 노출)
                if (result.data && result.data[0] && result.data[0].store_code) {
                    document.getElementById('storeCodeDisplayGroup').style.display = 'block';
                    document.getElementById('storeCodeDisplay').value = result.data[0].store_code;
                }

                showAlert('dashboardView', '매장 정보가 저장되었습니다! 관리자 승인 후 지도에 표시됩니다.', 'success');
            } catch (error) {
                showAlert('dashboardView', '저장 실패: ' + error.message, 'error');
            }
        }

        // 상단 카드에서 매장 코드로 매장 연결
        async function connectStoreFromTop() {
            const storeCode = document.getElementById('storeCodeTop').value.trim();
            if (!storeCode) {
                showAlert('dashboardView', '매장 코드를 입력해주세요.', 'error');
                return;
            }
            await connectStore(storeCode, 'storeCodeTop');
        }

        // 매장 코드로 매장 연결
        async function connectStore(storeCodeInput = null, inputId = null) {
            const storeCode = storeCodeInput || (inputId ? document.getElementById(inputId).value.trim() : '');

            if (!storeCode) {
                showAlert('dashboardView', '매장 코드를 입력해주세요.', 'error');
                return;
            }

            if (!currentUser) {
                showAlert('dashboardView', '로그인이 필요합니다.', 'error');
                return;
            }

            try {
                // 매장 코드로 매장 찾기 (RLS 정책을 우회하기 위해 서버 함수를 사용하거나, 
                // 관리자가 미리 설정한 매장 코드로 찾기)
                // 일단 직접 조회 시도 (승인된 매장은 모두 볼 수 있으므로)
                const { data: storeData, error: findError } = await supabaseClient
                    .from('doozonku')
                    .select('*')
                    .eq('store_code', storeCode)
                    .maybeSingle();

                if (findError) {
                    throw findError;
                }

                if (!storeData) {
                    showAlert('dashboardView', '매장 코드가 올바르지 않습니다. 관리자에게 문의하세요.', 'error');
                    return;
                }

                // 이미 현재 사용자에게 연결되어 있는지 확인
                if (storeData.user_id === currentUser.id || 
                    storeData.user_id_2 === currentUser.id ||
                    storeData.user_id_3 === currentUser.id ||
                    storeData.user_id_4 === currentUser.id ||
                    storeData.user_id_5 === currentUser.id ||
                    storeData.user_id_6 === currentUser.id) {
                    showAlert('dashboardView', '이미 이 매장에 연결되어 있습니다.', 'info');
                    await loadStoreData();
                    return;
                }

                // 이미 6명이 연결되어 있는지 확인
                if (storeData.user_id && storeData.user_id_2 && storeData.user_id_3 && 
                    storeData.user_id_4 && storeData.user_id_5 && storeData.user_id_6) {
                    showAlert('dashboardView', '이 매장은 이미 6명의 사용자에게 연결되어 있습니다. (최대 6명)', 'error');
                    return;
                }

                // 매장의 user_id부터 user_id_6까지 빈 자리에 현재 사용자 추가
                let updateData;
                let updateError;
                let updateField = {};
                
                if (!storeData.user_id) {
                    updateField = { user_id: currentUser.id };
                } else if (!storeData.user_id_2) {
                    updateField = { user_id_2: currentUser.id };
                } else if (!storeData.user_id_3) {
                    updateField = { user_id_3: currentUser.id };
                } else if (!storeData.user_id_4) {
                    updateField = { user_id_4: currentUser.id };
                } else if (!storeData.user_id_5) {
                    updateField = { user_id_5: currentUser.id };
                } else if (!storeData.user_id_6) {
                    updateField = { user_id_6: currentUser.id };
                } else {
                    // 이미 6명이 연결되어 있음 (위에서 체크했지만 안전장치)
                    showAlert('dashboardView', '이 매장은 이미 6명의 사용자에게 연결되어 있습니다. (최대 6명)', 'error');
                    return;
                }

                const result = await supabaseClient
                    .from('doozonku')
                    .update(updateField)
                    .eq('store_code', storeCode)
                    .eq('id', storeData.id)
                    .select()
                    .single();
                updateData = result.data;
                updateError = result.error;

                if (updateError) {
                    // RLS 정책 때문에 업데이트가 안 될 수 있음
                    // 이 경우 관리자에게 문의하도록 안내
                    console.error('매장 연결 오류:', updateError);
                    showAlert('dashboardView', '매장 연결에 실패했습니다. 관리자에게 문의하세요. 오류: ' + updateError.message, 'error');
                    return;
                }

                // 연결 성공
                currentStoreId = updateData.id;
                showAlert('dashboardView', '매장이 성공적으로 연결되었습니다!', 'success');
                
                // 입력 필드 초기화
                if (inputId === 'storeCodeTop') {
                    document.getElementById('storeCodeTop').value = '';
                }
                
                // 매장 데이터 다시 불러오기
                await loadStoreData();
            } catch (error) {
                console.error('매장 연결 오류:', error);
                showAlert('dashboardView', '매장 연결 실패: ' + error.message, 'error');
            }
        }

        // 비밀번호 변경
        async function changePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const newPasswordConfirm = document.getElementById('newPasswordConfirm').value;

            if (!newPassword || !newPasswordConfirm) {
                showAlert('dashboardView', '새 비밀번호를 입력해주세요.', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('dashboardView', '비밀번호는 최소 6자 이상이어야 합니다.', 'error');
                return;
            }

            if (newPassword !== newPasswordConfirm) {
                showAlert('dashboardView', '비밀번호가 일치하지 않습니다.', 'error');
                return;
            }

            try {
                const { data, error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                // 비밀번호 필드 초기화
                document.getElementById('newPassword').value = '';
                document.getElementById('newPasswordConfirm').value = '';

                showAlert('dashboardView', '비밀번호가 성공적으로 변경되었습니다!', 'success');
            } catch (error) {
                showAlert('dashboardView', '비밀번호 변경 실패: ' + error.message, 'error');
            }
        }

        // 알림 메시지 표시
        function showAlert(viewId, message, type) {
            const alertBox = viewId === 'loginView' 
                ? document.getElementById('alertBox')
                : document.getElementById('dashboardAlert');
            
            alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            
            setTimeout(() => {
                alertBox.innerHTML = '';
            }, 5000);
        }
    </script>
