name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [deploy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config.js from secrets
        run: |
          echo "Creating config.js from secrets..."
          cat > config.js << EOF
          // Supabase 설정
          const SUPABASE_URL = '${{ secrets.SUPABASE_URL }}';
          const SUPABASE_ANON_KEY = '${{ secrets.SUPABASE_ANON_KEY }}';

          // 네이버 지도 API 클라이언트 ID
          const NAVER_MAP_CLIENT_ID = '${{ secrets.NAVER_MAP_CLIENT_ID }}';

          // 관리자 이메일
          const ADMIN_EMAIL = '${{ secrets.ADMIN_EMAIL }}';
          EOF
          echo "config.js created successfully"
          echo "Checking if config.js exists..."
          ls -la config.js || echo "ERROR: config.js was not created!"
          
      - name: Verify config.js
        run: |
          if [ ! -f config.js ]; then
            echo "ERROR: config.js file was not created!"
            exit 1
          fi
          echo "config.js exists. First few lines:"
          head -n 5 config.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
